version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.5.0  # Node.js environment
    steps:
      - checkout

      - run:
          name: Step 1 - Say Hello
          command: |
            echo "👋 Starting the CI pipeline for Stopwatch-with-Lap-Timer..."

      - run:
          name: Step 2 - Check for package.json
          command: |
            if [ -f package.json ]; then
              echo "📦 Found package.json. Installing dependencies..."
              npm install
            else
              echo "⚠️ No package.json found. Skipping npm install."
            fi

      - run:
          name: Step 3 - Dummy Test/Lint Step
          command: |
            echo "🔍 Running dummy tests/lint..."
            echo "✅ No actual tests defined yet. This is just a placeholder."

      - run:
          name: Step 4 - Done!
          command: |
            echo "🎉 CI pipeline finished successfully."

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
